name: Mobile Release Build (APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: devtrack_frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: devtrack_frontend
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        working-directory: devtrack_frontend
        run: flutter build appbundle --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: devtrack_frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: devtrack_frontend/build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            devtrack_frontend/build/app/outputs/flutter-apk/app-release.apk
            devtrack_frontend/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
