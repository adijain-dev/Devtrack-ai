name: DevTrack AI Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x devtrack_backend/mvnw

      - name: Build and Package Backend
        working-directory: devtrack_backend
        run: ./mvnw clean package -DskipTests=false

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devtrack-backend-jar
          path: devtrack_backend/target/*.jar

  frontend-ci:
    name: Frontend Lint & Release APK Build (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: devtrack_frontend
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: devtrack_frontend
        run: flutter analyze

      - name: Build Release APK
        working-directory: devtrack_frontend
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: devtrack-release-apk
          path: devtrack_frontend/build/app/outputs/flutter-apk/app-release.apk
