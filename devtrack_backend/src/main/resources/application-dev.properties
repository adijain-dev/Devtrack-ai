# Development Profile with embedded file-based DB (Zero PostgreSQL setup needed)
spring.datasource.url=jdbc:h2:file:./devtrack_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expirationMs=86400000

# Server Port
server.port=8080

# Groq AI Configuration
app.grok.api-key=${GROQ_API_KEY:}
app.grok.api-url=https://api.groq.com/openai/v1/chat/completions
app.grok.model=llama-3.3-70b-versatile
