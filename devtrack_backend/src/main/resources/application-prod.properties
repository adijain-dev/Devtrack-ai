spring.application.name=devtrack_backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:devtrack}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Should be configured via env variables in prod)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expirationMs=86400000

# Server Port
server.port=8080

# Groq AI Configuration
app.grok.api-key=${GROQ_API_KEY:}
app.grok.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.grok.model=${GROQ_MODEL:llama-3.3-70b-versatile}
