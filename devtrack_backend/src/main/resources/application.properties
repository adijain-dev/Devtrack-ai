spring.application.name=devtrack_backend
spring.profiles.active=dev
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/devtrack
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (Should be at least 256 bits, this is base64 encoded for dev)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expirationMs=86400000

# Server Port
server.port=8080

# Groq AI Configuration (using Groq instead of xAI Grok)
app.grok.api-key=${GROQ_API_KEY:}
app.grok.api-url=https://api.groq.com/openai/v1/chat/completions
app.grok.model=llama-3.3-70b-versatile

